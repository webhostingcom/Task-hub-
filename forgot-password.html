<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >  <title>Task Hub | Forgot Password</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
    }

    .logo {
      text-align: center;
      font-size: 26px;
      font-weight: 800;
      color: #5b5cf0;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 23px;
      text-align: center;
      margin-bottom: 9px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #5b5cf0;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #5b5cf0;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.45;
    }

    .message.success {
      display: block;
      background: #e9f8ee;
      color: #176b35;
    }

    .message.error {
      display: block;
      background: #ffecec;
      color: #a51d1d;
    }

    .links {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }

    .links a {
      color: #5b5cf0;
      text-decoration: none;
      font-weight: 700;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style></head><body>  <main class="card"><div class="logo">
  Task Hub
</div>

<h1>
  Forgot Password?
</h1>

<p class="subtitle">
  Enter the email address connected to your
  Task Hub account. We'll send you a password
  reset link if the account exists.
</p>


<form id="forgotPasswordForm">

  <label for="email">
    Email Address
  </label>

  <input
    type="email"
    id="email"
    autocomplete="email"
    placeholder="Enter your email"
    required
  >


  <div
    id="message"
    class="message"
  ></div>


  <button
    type="submit"
    id="submitButton"
  >
    Send Reset Link
  </button>

</form>


<div class="links">

  <a href="login.html">
    ← Back to Login
  </a>

</div>

  </main>  <script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://bcogfxghqrffrnfetqbo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_cX6B4WgoF6bwz1Br5kIj4g_p4RsBRJP";


    // ==========================================
    // ELEMENTS
    // ==========================================

    const form =
      document.getElementById(
        "forgotPasswordForm"
      );

    const emailInput =
      document.getElementById(
        "email"
      );

    const message =
      document.getElementById(
        "message"
      );

    const submitButton =
      document.getElementById(
        "submitButton"
      );


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(
      text,
      type
    ) {

      message.className =
        `message ${type}`;

      message.textContent =
        text;

    }


    // ==========================================
    // SEND PASSWORD RESET EMAIL
    // ==========================================

    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const email =
          emailInput.value
            .trim()
            .toLowerCase();


        if (!email) {

          showMessage(
            "Please enter your email address.",
            "error"
          );

          return;

        }


        submitButton.disabled =
          true;

        submitButton.textContent =
          "Sending...";


        try {

          const redirectUrl =
            `${window.location.origin}` +
            `${window.location.pathname
              .split("/")
              .slice(0, -1)
              .join("/")}/` +
            "reset-password.html";


          const response =
            await fetch(
              `${SUPABASE_URL}/auth/v1/recover`,
              {
                method: "POST",

                headers: {
                  apikey:
                    SUPABASE_KEY,

                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    email,
                    redirect_to:
                      redirectUrl
                  })
              }
            );


          const text =
            await response.text();


          let data = null;


          try {

            data =
              text
                ? JSON.parse(text)
                : null;

          } catch {

            data =
              text;

          }


          if (!response.ok) {

            throw new Error(
              data?.message ||
              data?.msg ||
              data?.error_description ||
              "Unable to send password reset email."
            );

          }


          /*
            Supabase may intentionally return a
            successful response even when the email
            is not registered. This prevents revealing
            whether an email belongs to an account.
          */

          showMessage(
            "If an account exists with that email, a password reset link has been sent. Please check your inbox.",
            "success"
          );


          emailInput.value = "";


        } catch (error) {

          console.error(
            "Password recovery error:",
            error
          );


          showMessage(
            error.message ||
            "Unable to send password reset email.",
            "error"
          );

        } finally {

          submitButton.disabled =
            false;

          submitButton.textContent =
            "Send Reset Link";

        }

      }
    );

  </script>
  
  </body>
</html>
