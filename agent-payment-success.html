<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Hub | Agent Activated</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .success-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 18px;
      background: #f7f7fb;
    }

    .success-card {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border-radius: 16px;
      padding: 35px 28px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .success-icon {
      width: 78px;
      height: 78px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #eaf8ef;
      color: #176b38;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }

    .success-card h1 {
      margin: 0 0 12px;
      color: #17172b;
      font-size: 28px;
    }

    .success-message {
      color: #666;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .reference {
      padding: 12px;
      margin: 20px 0;
      border-radius: 9px;
      background: #f7f7f9;
      color: #555;
      font-size: 13px;
      word-break: break-word;
    }

    .actions {
      margin-top: 25px;
    }

    .action-btn {
      display: inline-block;
      margin: 5px;
      padding: 12px 18px;
      border-radius: 9px;
      text-decoration: none;
      font-weight: 700;
    }

    .primary {
      background: #5b5cf0;
      color: #fff;
    }

    .secondary {
      background: #eeeef5;
      color: #333;
    }

    .error-card {
      background: #fff0f0;
      color: #a32929;
      padding: 14px;
      border-radius: 9px;
      line-height: 1.5;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <main class="success-page">
    <section class="success-card">

      <div id="successContent">

        <div class="success-icon">
          ✓
        </div>

        <h1>Agent Account Activated!</h1>

        <p class="success-message">
          Your wallet payment was successful and your
          Task Hub Agent account is now active.
        </p>

        <div
          id="roleText"
          class="success-message"
        ></div>

        <div
          id="referenceBox"
          class="reference"
          style="display:none;"
        ></div>

        <div class="actions">

          <a
            href="agent-dashboard.html"
            class="action-btn primary"
          >
            Open Agent Dashboard
          </a>

          <a
            href="dashboard.html"
            class="action-btn secondary"
          >
            Main Dashboard
          </a>

        </div>

      </div>

      <div
        id="errorContent"
        style="display:none;"
      >

        <div class="success-icon">
          !
        </div>

        <h1>Something went wrong</h1>

        <div
          id="errorMessage"
          class="error-card"
        >
          We could not confirm the Agent purchase.
        </div>

        <div class="actions">

          <a
            href="agent.html"
            class="action-btn primary"
          >
            Back to Agent Program
          </a>

          <a
            href="dashboard.html"
            class="action-btn secondary"
          >
            Dashboard
          </a>

        </div>

      </div>

    </section>
  </main>

  <script>
    const params =
      new URLSearchParams(
        window.location.search
      );

    const success =
      params.get("success");

    const role =
      params.get("role");

    const reference =
      params.get("reference");

    const successContent =
      document.getElementById(
        "successContent"
      );

    const errorContent =
      document.getElementById(
        "errorContent"
      );

    const roleText =
      document.getElementById(
        "roleText"
      );

    const referenceBox =
      document.getElementById(
        "referenceBox"
      );

    const errorMessage =
      document.getElementById(
        "errorMessage"
      );

    if (success === "true") {

      if (role) {
        roleText.textContent =
          "Your " +
          role +
          " role is ready to use.";
      }

      if (reference) {
        referenceBox.textContent =
          "Transaction reference: " +
          reference;

        referenceBox.style.display =
          "block";
      }

    } else {

      successContent.style.display =
        "none";

      errorContent.style.display =
        "block";

    }
  </script>

</body>
</html>
