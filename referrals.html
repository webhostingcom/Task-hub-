<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Hub | Referrals</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="container">

  <h1>Referral Program</h1>

  <div class="card">
    <h2>Earn ₦1,500</h2>
    <p>Invite someone to Task Hub. When they complete their first approved task, you earn ₦1,500.</p>

    <label>Your Referral Link</label>

    <div style="display:flex;gap:8px;margin-top:8px;">
      <input
        id="referralLink"
        type="text"
        readonly
        style="flex:1;"
      >

      <button onclick="copyReferralLink()">Copy</button>
    </div>

    <p id="copyMessage"></p>
  </div>

  <div class="card">
    <h2>Your Referrals</h2>

    <p>
      Referrals: <strong id="referralCount">0</strong>
    </p>

    <p>
      Earnings: <strong id="referralEarnings">₦0</strong>
    </p>

    <div id="referralList">
      Loading...
    </div>
  </div>

</div>

<script>
const SUPABASE_URL = "https://bcogfxghqrffrnfetqbo.supabase.co";
const SUPABASE_KEY = "sb_publishable_cX6B4WgoF6bwz1Br5kIj4g_p4RsBRJP";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loadReferrals() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    location.href = "login.html";
    return;
  }

  const { data: profile, error } =
    await supabaseClient
      .from("profiles")
      .select("referral_code")
      .eq("id", user.id)
      .single();

  if (error || !profile || !profile.referral_code) {
    document.getElementById("referralLink").value =
      "Referral link unavailable";
    return;
  }

  const link =
    `${location.origin}${location.pathname.replace(
      "referrals.html",
      "register.html"
    )}?ref=${encodeURIComponent(profile.referral_code)}`;

  document.getElementById("referralLink").value = link;

  const { data: referrals, error: referralError } =
    await supabaseClient.rpc("get_my_referrals");

  if (referralError) {
    document.getElementById("referralList").innerHTML =
      "Unable to load referrals.";
    return;
  }

  const list = referrals || [];

  document.getElementById("referralCount").textContent = list.length;

  const earnings = list.reduce(
    (total, item) => total + Number(item.reward_amount || 1500),
    0
  );

  document.getElementById("referralEarnings").textContent =
    "₦" + earnings.toLocaleString();

  if (!list.length) {
    document.getElementById("referralList").innerHTML =
      "<p>No referrals yet.</p>";
    return;
  }

  document.getElementById("referralList").innerHTML =
    list.map(item => `
      <div class="card">
        <strong>${escapeHtml(
          item.username || item.full_name || "User"
        )}</strong>
        <br>
        Reward: ₦${Number(
          item.reward_amount || 1500
        ).toLocaleString()}
      </div>
    `).join("");
}

function copyReferralLink() {
  const input = document.getElementById("referralLink");

  navigator.clipboard.writeText(input.value);

  document.getElementById("copyMessage").textContent =
    "Referral link copied!";
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

loadReferrals();
</script>

</body>
</html>
