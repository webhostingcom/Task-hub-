<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Hub | Upgrade</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .upgrade-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 18px;
      background: #f7f7fb;
    }

    .upgrade-card {
      width: 100%;
      max-width: 470px;
      background: #fff;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .upgrade-card h1 {
      margin: 0 0 8px;
      color: #17172b;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 25px;
      color: #686879;
      line-height: 1.5;
    }

    .plan-summary {
      padding: 20px;
      margin-bottom: 22px;
      border-radius: 12px;
      background: #f1f1ff;
    }

    .plan-name {
      margin: 0 0 8px;
      color: #3334a4;
      font-size: 23px;
      font-weight: 800;
    }

    .plan-price {
      margin: 0;
      color: #17172b;
      font-size: 30px;
      font-weight: 800;
    }

    .plan-details {
      margin-top: 12px;
      color: #626274;
      font-size: 14px;
      line-height: 1.6;
    }

    .reward-box {
      margin: 20px 0;
      padding: 14px;
      border-radius: 9px;
      background: #f7f7f9;
      text-align: center;
      color: #333344;
      font-weight: 700;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 13px 14px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.45;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a32929;
    }

    .message.success {
      display: block;
      background: #eaf8ef;
      color: #176b38;
    }

    .pay-btn {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 14px;
      background: #5b5cf0;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .pay-btn:hover {
      background: #4748d8;
    }

    .pay-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .back-link {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #5b5cf0;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="upgrade-page">
    <section class="upgrade-card">

      <h1>Upgrade Plan</h1>

      <p class="subtitle">
        Review your selected plan before continuing to secure
        Paystack checkout.
      </p>

      <div id="message" class="message"></div>

      <div id="planSummary" class="plan-summary">
        Loading plan...
      </div>

      <div id="rewardBox" class="reward-box" style="display:none;"></div>

      <button
        type="button"
        id="payButton"
        class="pay-btn"
        disabled
      >
        Continue to Payment
      </button>

      <a href="plans.html" class="back-link">
        Back to Plans
      </a>

    </section>
  </main>

  <script>
    const SUPABASE_URL =
      "https://bcogfxghqrffrnfetqbo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_cX6B4WgoF6bwz1Br5kIj4g_p4RsBRJP";

    const planSummary =
      document.getElementById("planSummary");

    const rewardBox =
      document.getElementById("rewardBox");

    const payButton =
      document.getElementById("payButton");

    const message =
      document.getElementById("message");

    const params =
      new URLSearchParams(window.location.search);

    const planId =
      params.get("plan_id");

    let selectedPlan = null;

    function getToken() {
      return localStorage.getItem(
        "taskhub_access_token"
      );
    }

    function clearSession() {
      localStorage.removeItem("taskhub_access_token");
      localStorage.removeItem("taskhub_refresh_token");
      localStorage.removeItem("taskhub_user_id");
      localStorage.removeItem("taskhub_email");

      window.location.href = "login.html";
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className =
        "message " + type;
    }

    function formatNaira(amount) {
      return "₦" +
        Number(amount || 0).toLocaleString("en-NG");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function getPlan() {
      const token = getToken();

      if (!token) {
        window.location.href = "login.html";
        return;
      }

      if (!planId) {
        showMessage(
          "No plan was selected. Please return to the plans page.",
          "error"
        );

        planSummary.textContent =
          "No plan selected.";

        return;
      }

      try {
        const response = await fetch(
          SUPABASE_URL +
          "/rest/v1/taskhub_plans" +
          "?select=id,name,price,reward,duration_days" +
          "&id=eq." +
          encodeURIComponent(planId) +
          "&limit=1",
          {
            method: "GET",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + token
            }
          }
        );

        if (
          response.status === 401 ||
          response.status === 403
        ) {
          clearSession();
          return;
        }

        if (!response.ok) {
          throw new Error(
            "Unable to load the selected plan."
          );
        }

        const plans = await response.json();

        if (
          !Array.isArray(plans) ||
          plans.length === 0
        ) {
          throw new Error(
            "The selected plan could not be found."
          );
        }

        selectedPlan = plans[0];

        if (
          Number(selectedPlan.price || 0) <= 0
        ) {
          showMessage(
            "This plan does not require payment.",
            "error"
          );

          planSummary.innerHTML = `
            <p class="plan-name">
              ${escapeHtml(selectedPlan.name)}
            </p>
            <p class="plan-price">
              ${formatNaira(selectedPlan.price)}
            </p>
          `;

          return;
        }

        planSummary.innerHTML = `
          <p class="plan-name">
            ${escapeHtml(selectedPlan.name)}
          </p>

          <p class="plan-price">
            ${formatNaira(selectedPlan.price)}
          </p>

          <div class="plan-details">
            Plan duration:
            ${selectedPlan.duration_days
              ? escapeHtml(selectedPlan.duration_days) + " days"
              : "No expiration"}
          </div>
        `;

        rewardBox.textContent =
          formatNaira(selectedPlan.reward) +
          " reward per approved eligible task";

        rewardBox.style.display = "block";

        payButton.disabled = false;

      } catch (error) {
        console.error(error);

        showMessage(
          error.message ||
          "Unable to load this plan.",
          "error"
        );

        planSummary.textContent =
          "Unable to load plan.";
      }
    }

    payButton.addEventListener(
      "click",
      async function () {

        if (!selectedPlan) {
          return;
        }

        const token = getToken();

        if (!token) {
          window.location.href = "login.html";
          return;
        }

        payButton.disabled = true;
        payButton.textContent =
          "Preparing Payment...";

        showMessage(
          "Connecting to secure payment checkout...",
          "success"
        );

        try {
          const response = await fetch(
            SUPABASE_URL +
            "/functions/v1/initialize-plan-payment",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY,
                "Authorization":
                  "Bearer " + token
              },
              body: JSON.stringify({
                plan_id: Number(selectedPlan.id)
              })
            }
          );

          if (
            response.status === 401 ||
            response.status === 403
          ) {
            clearSession();
            return;
          }

          const data =
            await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(
              data.message ||
              data.error ||
              "Unable to initialize payment."
            );
          }

          const checkoutUrl =
            data.authorization_url ||
            data.data?.authorization_url;

          if (!checkoutUrl) {
            throw new Error(
              "Payment checkout URL was not returned."
            );
          }

          window.location.href =
            checkoutUrl;

        } catch (error) {
          console.error(
            "Plan payment error:",
            error
          );

          showMessage(
            error.message ||
            "Unable to start payment. Please try again.",
            "error"
          );

          payButton.disabled = false;
          payButton.textContent =
            "Continue to Payment";
        }
      }
    );

    getPlan();
  </script>

</body>
</html>
