<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Task Hub | Upgrade</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .upgrade-page {
      min-height: 100vh;
      background: #f7f7fb;
      padding: 35px 18px 60px;
    }

    .upgrade-container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    .upgrade-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .upgrade-header h1 {
      margin: 0 0 8px;
      color: #17172b;
      font-size: 30px;
    }

    .upgrade-header p {
      margin: 0;
      color: #686879;
      line-height: 1.5;
    }

    .message {
      display: none;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      line-height: 1.5;
      font-size: 14px;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a32929;
    }

    .message.success {
      display: block;
      background: #eaf8ef;
      color: #176b38;
    }

    .plan-card {
      background: #fff;
      border: 1px solid #e4e4ec;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
    }

    .plan-card h2 {
      margin: 0 0 6px;
      color: #17172b;
      font-size: 25px;
    }

    .plan-description {
      margin: 0 0 22px;
      color: #707080;
      line-height: 1.5;
    }

    .price-box {
      padding: 20px;
      border-radius: 12px;
      background: #f1f1ff;
      text-align: center;
      margin-bottom: 20px;
    }

    .price {
      font-size: 34px;
      font-weight: 800;
      color: #17172b;
    }

    .price-label {
      margin-top: 5px;
      color: #777787;
      font-size: 13px;
    }

    .reward-box {
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 10px;
      background: #f7f7f9;
      text-align: center;
      color: #333344;
      font-weight: 700;
    }

    .details {
      margin: 0 0 25px;
      padding: 0;
      list-style: none;
    }

    .details li {
      padding: 11px 0;
      border-bottom: 1px solid #eeeeF2;
      color: #555565;
      font-size: 14px;
    }

    .details li:last-child {
      border-bottom: 0;
    }

    .continue-btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      border: 0;
      border-radius: 9px;
      padding: 14px;
      background: #5b5cf0;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .continue-btn:hover {
      background: #4748d8;
    }

    .continue-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #5b5cf0;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 35px 15px;
      color: #686879;
    }
  </style>
</head>

<body>

  <main class="upgrade-page">

    <div class="upgrade-container">

      <header class="upgrade-header">
        <h1>Upgrade Membership</h1>

        <p>
          Review your selected membership plan before
          continuing.
        </p>
      </header>

      <div id="message" class="message"></div>

      <div id="planContainer" class="plan-card">

        <div class="loading">
          Loading selected plan...
        </div>

      </div>

      <a href="plans.html" class="back-link">
        ← Back to Membership Plans
      </a>

    </div>

  </main>

  <script>
    const SUPABASE_URL =
      "https://bcogfxghqrffrnfetqbo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_cX6B4WgoF6bwz1Br5kIj4g_p4RsBRJP";

    const planContainer =
      document.getElementById("planContainer");

    const messageBox =
      document.getElementById("message");

    const urlParams =
      new URLSearchParams(window.location.search);

    const planId =
      urlParams.get("plan_id");


    function getToken() {
      return localStorage.getItem(
        "taskhub_access_token"
      );
    }


    function clearSession() {
      localStorage.removeItem(
        "taskhub_access_token"
      );

      localStorage.removeItem(
        "taskhub_refresh_token"
      );

      localStorage.removeItem(
        "taskhub_user_id"
      );

      localStorage.removeItem(
        "taskhub_email"
      );

      window.location.href = "login.html";
    }


    function showMessage(text, type) {
      messageBox.textContent = text;

      messageBox.className =
        "message " + type;
    }


    function formatNaira(amount) {
      return "₦" +
        Number(amount || 0).toLocaleString(
          "en-NG"
        );
    }


    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    async function loadSelectedPlan() {

      const token = getToken();

      if (!token) {
        window.location.href = "login.html";
        return;
      }


      if (!planId) {

        showMessage(
          "No membership plan was selected. Please return to the plans page.",
          "error"
        );

        planContainer.innerHTML = `
          <div class="loading">
            No plan selected.
          </div>
        `;

        return;
      }


      try {

        /*
         * IMPORTANT:
         * The database column is task_reward,
         * not reward.
         */

        const response = await fetch(
          SUPABASE_URL +
          "/rest/v1/taskhub_plans" +
          "?select=id,name,price,task_reward,duration_days" +
          "&id=eq." +
          encodeURIComponent(planId) +
          "&limit=1",
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + token
            }
          }
        );


        if (
          response.status === 401 ||
          response.status === 403
        ) {
          clearSession();
          return;
        }


        const data =
          await response.json().catch(
            () => ({})
          );


        if (!response.ok) {

          console.error(
            "Plan loading error:",
            data
          );

          throw new Error(
            data.message ||
            data.details ||
            data.hint ||
            "Unable to load the selected plan."
          );
        }


        if (
          !Array.isArray(data) ||
          data.length === 0
        ) {

          throw new Error(
            "The selected membership plan could not be found."
          );
        }


        const plan = data[0];


        /*
         * Only paid membership plans should
         * reach the upgrade page.
         */

        if (
          Number(plan.price || 0) <= 0
        ) {

          showMessage(
            "This is the Free plan and does not require payment.",
            "error"
          );

          planContainer.innerHTML = `
            <h2>
              ${escapeHtml(plan.name)}
            </h2>

            <p class="plan-description">
              This membership plan does not require payment.
            </p>

            <div class="price-box">
              <div class="price">
                ${formatNaira(plan.price)}
              </div>

              <div class="price-label">
                No payment required
              </div>
            </div>

            <a
              href="dashboard.html"
              class="continue-btn"
            >
              Return to Dashboard
            </a>
          `;

          return;
        }


        /*
         * Display the selected Pro/Premium plan.
         */

        planContainer.innerHTML = `

          <h2>
            ${escapeHtml(plan.name)}
          </h2>

          <p class="plan-description">
            Upgrade your Task Hub membership to
            ${escapeHtml(plan.name)}.
          </p>


          <div class="price-box">

            <div class="price">
              ${formatNaira(plan.price)}
            </div>

            <div class="price-label">
              Membership payment
            </div>

          </div>


          <div class="reward-box">

            ${formatNaira(plan.task_reward)}

            reward per approved eligible task

          </div>


          <ul class="details">

            <li>
              ✓ Membership:
              <strong>
                ${escapeHtml(plan.name)}
              </strong>
            </li>

            <li>
              ✓ Task reward:
              <strong>
                ${formatNaira(plan.task_reward)}
              </strong>
            </li>

            <li>
              ✓ Duration:
              <strong>
                ${
                  plan.duration_days
                    ? escapeHtml(
                        plan.duration_days
                      ) + " days"
                    : "No expiration"
                }
              </strong>
            </li>

            <li>
              ✓ Access to eligible Task Hub tasks
            </li>

            <li>
              ✓ Wallet and withdrawal access
            </li>

          </ul>


          <button
            type="button"
            id="continueButton"
            class="continue-btn"
          >
            Continue
          </button>

        `;


        const continueButton =
          document.getElementById(
            "continueButton"
          );


        continueButton.addEventListener(
          "click",
          function () {

            /*
             * Manual deposit flow:
             * send the selected plan to the
             * payment/deposit page.
             */

            window.location.href =
              "payment-success.html?plan_id=" +
              encodeURIComponent(plan.id) +
              "&source=membership";

          }
        );


      } catch (error) {

        console.error(
          "Unable to load selected plan:",
          error
        );


        showMessage(
          error.message ||
          "Unable to load the selected plan.",
          "error"
        );


        planContainer.innerHTML = `

          <div class="loading">

            Unable to load this membership plan.

            <br><br>

            <a
              href="plans.html"
              style="
                color:#5b5cf0;
                font-weight:700;
                text-decoration:none;
              "
            >
              Return to Plans
            </a>

          </div>

        `;
      }
    }


    loadSelectedPlan();

  </script>

</body>
</html>
