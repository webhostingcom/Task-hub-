const SUPABASE_URL =

const SUPABASE_KEY =

let accessToken =

let userId =

const messageBox =

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function money(value) {

  return "₦" +
    Number(value || 0).toLocaleString("en-NG", {
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    });

}


function showMessage(text, type = "success") {

  messageBox.textContent =
    text;

  messageBox.className =
    `message ${type}`;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function clearMessage() {

  messageBox.textContent =
    "";

  messageBox.className =
    "message";

}


function clearSessionAndRedirect() {

  localStorage.removeItem(
    "taskhub_access_token"
  );

  localStorage.removeItem(
    "taskhub_refresh_token"
  );

  localStorage.removeItem(
    "taskhub_user_id"
  );

  localStorage.removeItem(
    "taskhub_email"
  );

  window.location.href =
    "login.html";

}


async function apiRequest(path, options = {}) {

  if (!accessToken) {

    clearSessionAndRedirect();

    throw new Error(
      "Session expired."
    );

  }


  const response =
    await fetch(
      `${SUPABASE_URL}${path}`,
      {
        ...options,

        headers: {
          "apikey": SUPABASE_KEY,

          "Authorization":
            `Bearer ${accessToken}`,

          "Content-Type":
            "application/json",

          ...(options.headers || {})
        }
      }
    );


  if (response.status === 401) {

    clearSessionAndRedirect();

    throw new Error(
      "Session expired."
    );

  }


  let data = null;


  if (response.status !== 204) {

    try {

      data =
        await response.json();

    } catch {

      data = null;

    }

  }


  if (!response.ok) {

    const errorMessage =
      data?.message ||
      data?.error_description ||
      data?.hint ||
      data?.details ||
      data?.error ||
      `Request failed with status ${response.status}.`;

    throw new Error(
      errorMessage
    );

  }


  return data;

}


/*
  CREATE TASK

  Important:
  Supabase must return the created row.
  If it returns nothing, we treat the operation
  as unsuccessful instead of showing fake success.
*/
async function createTask(payload) {

  const result =
    await apiRequest(
      `/rest/v1/tasks`,
      {
        method: "POST",

        headers: {
          "Prefer":
            "return=representation"
        },

        body:
          JSON.stringify(payload)
      }
    );


  if (
    !Array.isArray(result) ||
    result.length === 0
  ) {

    throw new Error(
      "Task was not created. Supabase did not return the created task. Check your tasks table permissions/RLS policies."
    );

  }


  return result[0];

}


/*
  UPDATE TASK

  Important:
  Supabase must return the updated row.
  An empty array means the request matched
  zero rows, commonly because of RLS or an
  incorrect task ID.
*/
async function updateTask(id, payload) {

  if (
    id === null ||
    id === undefined ||
    String(id).trim() === ""
  ) {

    throw new Error(
      "Missing task ID."
    );

  }


  const result =
    await apiRequest(
      `/rest/v1/tasks?id=eq.${encodeURIComponent(id)}`,
      {
        method: "PATCH",

        headers: {
          "Prefer":
            "return=representation"
        },

        body:
          JSON.stringify(payload)
      }
    );


  if (
    !Array.isArray(result) ||
    result.length === 0
  ) {

    throw new Error(
      "Task was not updated. Supabase matched 0 rows. Check the task ID and your UPDATE/RLS policy."
    );

  }


  return result[0];

}


/*
  DELETE TASK

  We request the deleted row back.
  This lets us know whether anything was
  actually deleted.
*/
async function deleteTask(id) {

  const confirmed =
    window.confirm(
      "Delete this task permanently?"
    );


  if (!confirmed) {

    return;

  }


  try {

    const result =
      await apiRequest(
        `/rest/v1/tasks?id=eq.${encodeURIComponent(id)}`,
        {
          method: "DELETE",

          headers: {
            "Prefer":
              "return=representation"
          }
        }
      );


    if (
      !Array.isArray(result) ||
      result.length === 0
    ) {

      throw new Error(
        "Task was not deleted. Supabase matched 0 rows. Check the task ID and your DELETE/RLS policy."
      );

    }


    showMessage(
      "Task deleted successfully."
    );


    resetForm();


    await loadTasks();

  } catch (error) {

    console.error(
      "Task delete error:",
      error
    );


    showMessage(
      error.message ||
      "Unable to delete task.",
      "error"
    );

  }

}


/*
  LOAD TASKS
*/
async function loadTasks() {

  taskList.innerHTML = `
    <div class="loading">
      Loading tasks...
    </div>
  `;


  try {

    const tasks =
      await apiRequest(
        `/rest/v1/tasks` +
        `?select=id,title,description,category,reward,instructions,task_link,status,access_level,created_at` +
        `&order=created_at.desc`
      );


    if (!Array.isArray(tasks)) {

      throw new Error(
        "Invalid task data returned from Supabase."
      );

    }


    renderTasks(tasks);

  } catch (error) {

    console.error(
      "Admin task loading error:",
      error
    );


    taskList.innerHTML = `
      <div class="empty-state">
        Unable to load tasks.
        <br>
        <small>
          ${escapeHtml(error.message)}
        </small>
      </div>
    `;


    showMessage(
      error.message ||
      "Unable to load admin tasks.",
      "error"
    );

  }

}


/*
  RENDER TASKS
*/
function renderTasks(tasks) {

  const total =
    tasks.length;


  const active =
    tasks.filter(
      task =>
        task.status === "active"
    ).length;


  const paused =
    tasks.filter(
      task =>
        task.status === "paused"
    ).length;


  document.getElementById(
    "totalTasks"
  ).textContent =
    total;


  document.getElementById(
    "activeTasks"
  ).textContent =
    active;


  document.getElementById(
    "pausedTasks"
  ).textContent =
    paused;


  if (!tasks.length) {

    taskList.innerHTML = `
      <div class="empty-state">
        No tasks have been created yet.
      </div>
    `;

    return;

  }


  taskList.innerHTML =
    tasks.map(task => {

      const access =
        task.access_level ||
        "free";


      const accessLabel =
        {
          free:
            "Free",

          pro:
            "Pro + Premium",

          premium:
            "Premium",

          all:
            "Everyone"

        }[access] ||
        access;


      const status =
        task.status ||
        "active";


      const statusLabel =
        status.charAt(0).toUpperCase() +
        status.slice(1);


      return `
        <article
          class="task-item"
          data-task-id="${escapeHtml(task.id)}"
        >

          <div class="task-top">

            <div>

              <div class="task-title">
                ${escapeHtml(task.title)}
              </div>

              <div class="task-description">
                ${escapeHtml(task.description)}
              </div>

            </div>

          </div>


          <div class="task-meta">

            <span class="badge">
              ${escapeHtml(
                task.category ||
                "General"
              )}
            </span>

            <span class="badge">
              ${money(task.reward)}
            </span>

            <span class="badge ${escapeHtml(access)}">
              ${escapeHtml(accessLabel)}
            </span>

            <span class="badge ${escapeHtml(status)}">
              ${escapeHtml(statusLabel)}
            </span>

          </div>


          <div class="task-actions">

            <button
              type="button"
              class="small-btn"
              data-action="edit"
              data-id="${escapeHtml(task.id)}"
            >
              Edit
            </button>


            ${
              status === "active"
                ? `
                  <button
                    type="button"
                    class="small-btn"
                    data-action="pause"
                    data-id="${escapeHtml(task.id)}"
                  >
                    Pause
                  </button>
                `
                : status === "paused"
                  ? `
                    <button
                      type="button"
                      class="small-btn"
                      data-action="activate"
                      data-id="${escapeHtml(task.id)}"
                    >
                      Activate
                    </button>
                  `
                  : ""
            }


            <button
              type="button"
              class="danger-btn"
              data-action="delete"
              data-id="${escapeHtml(task.id)}"
            >
              Delete
            </button>

          </div>

        </article>
      `;

    }).join("");

}


/*
  CHANGE TASK STATUS
*/
async function changeTaskStatus(
  id,
  status
) {

  try {

    await updateTask(
      id,
      {
        status:
          status
      }
    );


    showMessage(
      status === "active"
        ? "Task activated successfully."
        : "Task paused successfully."
    );


    await loadTasks();

  } catch (error) {

    console.error(
      "Task status update error:",
      error
    );


    showMessage(
      error.message ||
      "Unable to update task status.",
      "error"
    );

  }

}


/*
  EDIT TASK
*/
async function editTask(id) {

  try {

    const tasks =
      await apiRequest(
        `/rest/v1/tasks` +
        `?select=id,title,description,category,reward,instructions,task_link,status,access_level` +
        `&id=eq.${encodeURIComponent(id)}` +
        `&limit=1`
      );


    if (
      !Array.isArray(tasks) ||
      !tasks.length
    ) {

      showMessage(
        "Task could not be found.",
        "error"
      );

      return;

    }


    const task =
      tasks[0];


    taskId.value =
      task.id;


    taskTitle.value =
      task.title ||
      "";


    taskDescription.value =
      task.description ||
      "";


    taskInstructions.value =
      task.instructions ||
      "";


    taskCategory.value =
      task.category ||
      "";


    taskReward.value =
      task.reward ??
      "";


    taskAccess.value =
      task.access_level ||
      "free";


    taskStatus.value =
      task.status ||
      "active";


    taskLink.value =
      task.task_link ||
      "";


    formTitle.textContent =
      "Edit Task";


    saveTaskBtn.textContent =
      "Save Changes";


    cancelEditBtn.style.display =
      "inline-block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  } catch (error) {

    console.error(
      "Task edit loading error:",
      error
    );


    showMessage(
      error.message ||
      "Unable to load task.",
      "error"
    );

  }

}


/*
  RESET FORM
*/
function resetForm() {

  taskForm.reset();


  taskId.value =
    "";


  taskAccess.value =
    "free";


  taskStatus.value =
    "active";


  formTitle.textContent =
    "Create Task";


  saveTaskBtn.textContent =
    "Create Task";


  cancelEditBtn.style.display =
    "none";

}


/*
  TASK LIST BUTTONS
*/
taskList.addEventListener(
  "click",
  async function(event) {

    const button =
      event.target.closest(
        "button[data-action]"
      );


    if (!button) {
      return;
    }


    const id =
      button.dataset.id;


    const action =
      button.dataset.action;


    if (
      id === undefined ||
      id === null ||
      id === ""
    ) {

      showMessage(
        "Invalid task ID.",
        "error"
      );

      return;

    }


    if (action === "edit") {

      await editTask(id);

      return;

    }


    if (action === "pause") {

      button.disabled =
        true;

      await changeTaskStatus(
        id,
        "paused"
      );

      return;

    }


    if (action === "activate") {

      button.disabled =
        true;

      await changeTaskStatus(
        id,
        "active"
      );

      return;

    }


    if (action === "delete") {

      button.disabled =
        true;

      await deleteTask(id);

      return;

    }

  }
);


/*
  CREATE / UPDATE TASK
*/
taskForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    clearMessage();


    const payload = {

      title:
        taskTitle.value.trim(),

      description:
        taskDescription.value.trim(),

      category:
        taskCategory.value.trim() ||
        "General",

      reward:
        Number(
          taskReward.value
        ),

      instructions:
        taskInstructions.value.trim(),

      task_link:
        taskLink.value.trim() ||
        null,

      status:
        taskStatus.value,

      access_level:
        taskAccess.value

    };


    if (!payload.title) {

      showMessage(
        "Enter a task title.",
        "error"
      );

      return;

    }


    if (!payload.description) {

      showMessage(
        "Enter a task description.",
        "error"
      );

      return;

    }


    if (!payload.instructions) {

      showMessage(
        "Enter task instructions.",
        "error"
      );

      return;

    }


    if (
      !Number.isFinite(
        payload.reward
      ) ||
      payload.reward < 0
    ) {

      showMessage(
        "Enter a valid task reward.",
        "error"
      );

      return;

    }


    const editing =
      Boolean(
        taskId.value
      );


    saveTaskBtn.disabled =
      true;


    saveTaskBtn.textContent =
      editing
        ? "Saving..."
        : "Creating...";


    try {

      if (editing) {

        await updateTask(
          taskId.value,
          payload
        );


        showMessage(
          "Task updated successfully."
        );

      } else {

        await createTask(
          payload
        );


        showMessage(
          "Task created successfully."
        );

      }


      resetForm();


      /*
        Reload immediately so the admin
        sees the actual database state.
      */
      await loadTasks();

    } catch (error) {

      console.error(
        "Task save error:",
        error
      );


      showMessage(
        error.message ||
        "Unable to save task.",
        "error"
      );

    } finally {

      saveTaskBtn.disabled =
        false;


      /*
        If saving failed while editing,
        remain in edit mode.
      */
      if (taskId.value) {

        saveTaskBtn.textContent =
          "Save Changes";

      } else {

        saveTaskBtn.textContent =
          "Create Task";

      }

    }

  }
);


/*
  CANCEL EDIT
*/
cancelEditBtn.addEventListener(
  "click",
  function() {

    resetForm();

    clearMessage();

  }
);


/*
  START ADMIN PAGE
*/
async function startAdmin() {

  if (
    !accessToken ||
    !userId
  ) {

    window.location.href =
      "login.html";

    return;

  }


  await loadTasks();

}


startAdmin();

</script></body>
</html>
