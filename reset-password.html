<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Hub | Reset Password</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f7f7fb;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .auth-card h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #17172b;
    }

    .auth-card .subtitle {
      margin: 0 0 24px;
      color: #686879;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      color: #292938;
    }

    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px 14px;
      border: 1px solid #dcdce5;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #5b5cf0;
    }

    .password-hint {
      margin-top: 7px;
      font-size: 13px;
      color: #777787;
    }

    .submit-btn {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 13px;
      background: #5b5cf0;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #4748d8;
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.45;
    }

    .message.success {
      display: block;
      background: #eaf8ef;
      color: #176b38;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a32929;
    }

    .back-link {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #5b5cf0;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="auth-page">
    <section class="auth-card">
      <h1>Reset Password</h1>
      <p class="subtitle">
        Enter a new password for your Task Hub account.
      </p>

      <div id="message" class="message"></div>

      <form id="resetForm">
        <div class="form-group">
          <label for="password">New Password</label>
          <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            autocomplete="new-password"
            required
          >
          <div class="password-hint">
            Password must be at least 8 characters.
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <button type="submit" class="submit-btn" id="resetButton">
          Update Password
        </button>
      </form>

      <a href="login.html" class="back-link">
        Back to Login
      </a>
    </section>
  </main>

  <script>
    const SUPABASE_URL =
      "https://bcogfxghqrffrnfetqbo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_cX6B4WgoF6bwz1Br5kIj4g_p4RsBRJP";

    const resetForm = document.getElementById("resetForm");
    const resetButton = document.getElementById("resetButton");
    const message = document.getElementById("message");

    let recoveryAccessToken = null;
    let recoveryRefreshToken = null;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function getRecoveryTokens() {
      const hash = window.location.hash.substring(1);

      if (!hash) {
        return;
      }

      const params = new URLSearchParams(hash);

      const accessToken = params.get("access_token");
      const refreshToken = params.get("refresh_token");
      const type = params.get("type");

      if (type === "recovery" && accessToken) {
        recoveryAccessToken = accessToken;
        recoveryRefreshToken = refreshToken;

        localStorage.setItem(
          "taskhub_access_token",
          accessToken
        );

        if (refreshToken) {
          localStorage.setItem(
            "taskhub_refresh_token",
            refreshToken
          );
        }
      }
    }

    getRecoveryTokens();

    if (!recoveryAccessToken) {
      showMessage(
        "This password-reset link is missing or has expired. Please request a new reset link.",
        "error"
      );
    }

    resetForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!recoveryAccessToken) {
        showMessage(
          "Please open the password-reset link sent to your email.",
          "error"
        );
        return;
      }

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        showMessage(
          "Password must be at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "The passwords do not match.",
          "error"
        );
        return;
      }

      resetButton.disabled = true;
      resetButton.textContent = "Updating...";

      try {
        const response = await fetch(
          SUPABASE_URL + "/auth/v1/user",
          {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + recoveryAccessToken
            },
            body: JSON.stringify({
              password: password
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.message ||
            data.error_description ||
            data.error ||
            "Unable to update password."
          );
        }

        showMessage(
          "Password updated successfully. Redirecting you to login...",
          "success"
        );

        localStorage.removeItem("taskhub_access_token");
        localStorage.removeItem("taskhub_refresh_token");
        localStorage.removeItem("taskhub_user_id");
        localStorage.removeItem("taskhub_email");

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);

      } catch (error) {
        console.error("Password reset error:", error);

        showMessage(
          error.message ||
          "Unable to update your password. Please request a new reset link.",
          "error"
        );

        resetButton.disabled = false;
        resetButton.textContent = "Update Password";
      }
    });
  </script>

</body>
</html>
