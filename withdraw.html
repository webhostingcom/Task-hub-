<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw - Task Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h2 {
      font-size: 20px;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .balance-card {
      background: #111827;
      color: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .balance-label {
      font-size: 14px;
      opacity: .75;
      margin-bottom: 7px;
    }

    .balance {
      font-size: 30px;
      font-weight: bold;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
      margin-bottom: 20px;
    }

    .card h3 {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      margin-bottom: 15px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #111827;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .withdrawal {
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 0;
    }

    .withdrawal:last-child {
      border-bottom: none;
    }

    .withdrawal-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .amount {
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      margin-top: 5px;
      text-transform: capitalize;
    }

    .pending {
      color: #ca8a04;
    }

    .approved {
      color: #16a34a;
    }

    .rejected {
      color: #dc2626;
    }

    .date {
      color: #6b7280;
      font-size: 12px;
      margin-top: 5px;
    }

    .empty {
      color: #6b7280;
      text-align: center;
      padding: 15px 0;
    }

    .loading {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h2>Withdraw</h2>
    <a href="dashboard.html" class="back-btn">← Dashboard</a>
  </div>

  <div class="container">

    <div class="balance-card">
      <div class="balance-label">Available Balance</div>
      <div class="balance" id="balance">₦0.00</div>
    </div>

    <div class="card">

      <h3>Request Withdrawal</h3>

      <form id="withdrawForm">

        <label for="amount">Amount</label>
        <input
          type="number"
          id="amount"
          min="6500"
          step="0.01"
          placeholder="Minimum ₦6500"
          required
        >

        <label for="bankName">Bank Name</label>

        <select id="bankName" required disabled>
          <option value="">Loading banks...</option>
        </select>

        <label for="accountNumber">Account Number</label>

        <input
          type="text"
          id="accountNumber"
          inputmode="numeric"
          maxlength="10"
          placeholder="10-digit account number"
          required
        >

        <label for="accountName">Account Name</label>

        <input
          type="text"
          id="accountName"
          placeholder="Name on bank account"
          required
        >

        <button
          type="submit"
          id="submitBtn"
          disabled
        >
          Request Withdrawal
        </button>

      </form>

      <div id="message" class="message"></div>

    </div>

    <div class="card">

      <h3>My Withdrawal Requests</h3>

      <div id="withdrawals">
        Loading...
      </div>

    </div>

  </div>

  <script src="script.js"></script>

  <script>

    const accessToken =
      localStorage.getItem("taskhub_access_token");

    const userId =
      localStorage.getItem("taskhub_user_id");

    if (!accessToken || !userId) {
      window.location.href = "login.html";
    }

    let paystackBanks = [];

    async function loadWalletBalance() {

      try {

        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/profiles?id=eq.${userId}&select=balance`,
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${accessToken}`
            }
          }
        );

        if (!response.ok) {
          throw new Error("Unable to load balance.");
        }

        const data = await response.json();

        if (data.length) {

          const balance =
            Number(data[0].balance || 0);

          document.getElementById("balance").textContent =
            "₦" + balance.toLocaleString("en-NG", {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            });
        }

      } catch (error) {

        console.error(
          "Balance error:",
          error
        );

      }

    }


    async function loadPaystackBanks() {

      const bankSelect =
        document.getElementById("bankName");

      const submitBtn =
        document.getElementById("submitBtn");

      try {

        const response = await fetch(
          `${SUPABASE_URL}/functions/v1/get-paystack-banks`,
          {
            method: "GET",
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${accessToken}`
            }
          }
        );

        const result =
          await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.error ||
            "Unable to load banks."
          );
        }

        paystackBanks =
          Array.isArray(result.banks)
            ? result.banks
            : [];

        if (!paystackBanks.length) {
          throw new Error(
            "No banks were returned."
          );
        }

        bankSelect.innerHTML =
          `<option value="">Select bank</option>`;

        paystackBanks.forEach(bank => {

          const option =
            document.createElement("option");

          option.value = bank.code;
          option.textContent = bank.name;

          option.dataset.bankName =
            bank.name;

          bankSelect.appendChild(option);

        });

        bankSelect.disabled = false;
        submitBtn.disabled = false;

      } catch (error) {

        console.error(
          "Bank loading error:",
          error
        );

        bankSelect.innerHTML =
          `<option value="">
            Unable to load banks
          </option>`;

        bankSelect.disabled = true;
        submitBtn.disabled = true;

        const message =
          document.getElementById("message");

        message.className =
          "message error";

        message.textContent =
          "Unable to load the bank list. Please try again later.";

      }

    }


    async function loadWithdrawals() {

      const container =
        document.getElementById("withdrawals");

      try {

        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/withdrawal_requests?user_id=eq.${userId}&select=*&order=created_at.desc`,
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${accessToken}`
            }
          }
        );

        if (!response.ok) {
          throw new Error(
            "Failed to load withdrawals"
          );
        }

        const withdrawals =
          await response.json();

        if (!withdrawals.length) {

          container.innerHTML =
            `<div class="empty">
              No withdrawal requests yet.
            </div>`;

          return;
        }

        container.innerHTML =
          withdrawals.map(item => {

            const amount =
              Number(item.amount || 0)
                .toLocaleString("en-NG", {
                  minimumFractionDigits: 2,
                  maximumFractionDigits: 2
                });

            const date =
              new Date(
                item.created_at
              ).toLocaleString("en-NG");

            const accountNumber =
              String(
                item.account_number || ""
              );

            return `
              <div class="withdrawal">

                <div class="withdrawal-top">

                  <div>

                    <strong>
                      ${escapeHtml(
                        item.bank_name
                      )}
                    </strong>

                    <div class="date">
                      ****${escapeHtml(
                        accountNumber.slice(-4)
                      )}
                    </div>

                  </div>

                  <div class="amount">
                    ₦${amount}
                  </div>

                </div>

                <div class="status ${escapeHtml(
                  item.status
                )}">
                  ${escapeHtml(
                    item.status
                  )}
                </div>

                ${
                  item.paystack_status
                  ? `<div class="date">
                      Payout:
                      ${escapeHtml(
                        item.paystack_status
                      )}
                     </div>`
                  : ""
                }

                <div class="date">
                  ${date}
                </div>

                ${
                  item.admin_note
                  ? `<div class="date">
                      Note:
                      ${escapeHtml(
                        item.admin_note
                      )}
                     </div>`
                  : ""
                }

              </div>
            `;

          }).join("");

      } catch (error) {

        console.error(error);

        container.innerHTML =
          `<div class="empty">
            Unable to load withdrawal requests.
          </div>`;

      }

    }


    document
      .getElementById("withdrawForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();

          const amount =
            Number(
              document.getElementById(
                "amount"
              ).value
            );

          const bankSelect =
            document.getElementById(
              "bankName"
            );

          const bankCode =
            bankSelect.value;

          const selectedOption =
            bankSelect.options[
              bankSelect.selectedIndex
            ];

          const bankName =
            selectedOption
              ? selectedOption.dataset.bankName || ""
              : "";

          const accountNumber =
            document.getElementById(
              "accountNumber"
            ).value.trim();

          const accountName =
            document.getElementById(
              "accountName"
            ).value.trim();

          const message =
            document.getElementById(
              "message"
            );

          const submitBtn =
            document.getElementById(
              "submitBtn"
            );

          message.className =
            "message";

          message.textContent =
            "";

          if (
            !Number.isFinite(amount) ||
            amount < 6500
          ) {

            message.className =
              "message error";

            message.textContent =
              "Minimum withdrawal is ₦6,500.";

            return;
          }

          if (!bankCode || !bankName) {

            message.className =
              "message error";

            message.textContent =
              "Please select your bank.";

            return;
          }

          if (!/^\d{10}$/.test(
            accountNumber
          )) {

            message.className =
              "message error";

            message.textContent =
              "Account number must be exactly 10 digits.";

            return;
          }

          if (!accountName) {

            message.className =
              "message error";

            message.textContent =
              "Enter the account name.";

            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent =
            "Submitting...";

          try {

            const response =
              await fetch(
                `${SUPABASE_URL}/rest/v1/rpc/create_withdrawal_request`,
                {
                  method: "POST",

                  headers: {
                    apikey: SUPABASE_KEY,
                    Authorization:
                      `Bearer ${accessToken}`,
                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({
                    p_amount: amount,
                    p_bank_name: bankName,
                    p_bank_code: bankCode,
                    p_account_number:
                      accountNumber,
                    p_account_name:
                      accountName
                  })
                }
              );

            const result =
              await response.json();

            if (!response.ok) {

              throw new Error(
                result.message ||
                result.error_description ||
                result.details ||
                result.error ||
                "Withdrawal request failed."
              );

            }

            message.className =
              "message success";

            message.textContent =
              "Withdrawal request submitted successfully.";

            document
              .getElementById(
                "withdrawForm"
              )
              .reset();

            await loadWalletBalance();
            await loadWithdrawals();

          } catch (error) {

            console.error(
              "Withdrawal error:",
              error
            );

            message.className =
              "message error";

            message.textContent =
              error.message ||
              "Unable to submit withdrawal request.";

          } finally {

            submitBtn.disabled = false;

            submitBtn.textContent =
              "Request Withdrawal";

          }

        }
      );


    function escapeHtml(value) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        value ?? "";

      return div.innerHTML;
    }


    loadWalletBalance();
    loadPaystackBanks();
    loadWithdrawals();

  </script>

</body>
</html>
