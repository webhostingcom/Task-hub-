<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Hub | Notifications</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .notifications-page {
      min-height: 100vh;
      background: #f7f7fb;
      padding: 30px 18px 60px;
    }

    .notifications-container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 22px;
    }

    .page-header h1 {
      margin: 0;
      color: #17172b;
      font-size: 28px;
    }

    .mark-all-btn {
      border: 0;
      background: #5b5cf0;
      color: #fff;
      padding: 10px 13px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .mark-all-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .notification-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .notification {
      background: #fff;
      border: 1px solid #e3e3eb;
      border-radius: 12px;
      padding: 17px;
      cursor: pointer;
    }

    .notification.unread {
      border-left: 4px solid #5b5cf0;
      background: #fbfbff;
    }

    .notification-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
    }

    .notification-title {
      margin: 0;
      color: #222233;
      font-size: 16px;
      font-weight: 800;
    }

    .notification-message {
      margin: 7px 0 0;
      color: #626274;
      font-size: 14px;
      line-height: 1.55;
    }

    .notification-date {
      flex-shrink: 0;
      color: #8a8a98;
      font-size: 11px;
    }

    .notification-type {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 8px;
      border-radius: 20px;
      background: #ededf3;
      color: #555566;
      font-size: 11px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .empty-state,
    .loading-state {
      padding: 40px 20px;
      background: #fff;
      border-radius: 12px;
      text-align: center;
      color: #777787;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 14px;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a32929;
    }

    .message.success {
      display: block;
      background: #eaf8ef;
      color: #176b38;
    }

    .back-link {
      display: block;
      margin-top: 25px;
      text-align: center;
      color: #5b5cf0;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }

    @media (max-width: 550px) {
      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .mark-all-btn {
        width: 100%;
      }

      .notification-top {
        flex-direction: column;
        gap: 7px;
      }
    }
  </style>
</head>

<body>

  <main class="notifications-page">
    <div class="notifications-container">

      <div class="page-header">
        <h1>Notifications</h1>

        <button
          type="button"
          id="markAllBtn"
          class="mark-all-btn"
        >
          Mark All as Read
        </button>
      </div>

      <div id="message" class="message"></div>

      <div id="notificationList" class="notification-list">
        <div class="loading-state">
          Loading notifications...
        </div>
      </div>

      <a
        href="dashboard.html"
        class="back-link"
      >
        Back to Dashboard
      </a>

    </div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://bcogfxghqrffrnfetqbo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_cX6B4WgoF6bwz1Br5kIj4g_p4RsBRJP";

    const notificationList =
      document.getElementById(
        "notificationList"
      );

    const markAllBtn =
      document.getElementById(
        "markAllBtn"
      );

    const messageBox =
      document.getElementById(
        "message"
      );

    function getToken() {
      return localStorage.getItem(
        "taskhub_access_token"
      );
    }

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className =
        "message " + type;
    }

    function clearSession() {
      localStorage.removeItem(
        "taskhub_access_token"
      );
      localStorage.removeItem(
        "taskhub_refresh_token"
      );
      localStorage.removeItem(
        "taskhub_user_id"
      );
      localStorage.removeItem(
        "taskhub_email"
      );

      window.location.href =
        "login.html";
    }

    async function apiRequest(
      path,
      options = {}
    ) {
      const token = getToken();

      if (!token) {
        window.location.href =
          "login.html";
        return null;
      }

      const headers = {
        "apikey": SUPABASE_KEY,
        "Authorization":
          "Bearer " + token,
        "Content-Type":
          "application/json",
        ...(options.headers || {})
      };

      const response =
        await fetch(
          SUPABASE_URL + path,
          {
            ...options,
            headers
          }
        );

      if (
        response.status === 401 ||
        response.status === 403
      ) {
        clearSession();
        return null;
      }

      return response;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(value) {
      if (!value) {
        return "";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "";
      }

      return date.toLocaleString(
        "en-NG",
        {
          dateStyle: "medium",
          timeStyle: "short"
        }
      );
    }

    function notificationHtml(
      notification
    ) {
      const unread =
        !notification.is_read;

      const type =
        notification.type ||
        "general";

      return `
        <article
          class="notification ${
            unread ? "unread" : ""
          }"
          data-id="${escapeHtml(
            notification.id
          )}"
        >
          <div class="notification-top">
            <div>
              <h2 class="notification-title">
                ${escapeHtml(
                  notification.title ||
                  "Notification"
                )}
              </h2>

              <p class="notification-message">
                ${escapeHtml(
                  notification.message ||
                  ""
                )}
              </p>
            </div>

            <span class="notification-date">
              ${escapeHtml(
                formatDate(
                  notification.created_at
                )
              )}
            </span>
          </div>

          <span class="notification-type">
            ${escapeHtml(type)}
          </span>
        </article>
      `;
    }

    async function loadNotifications() {
      try {
        const response =
          await apiRequest(
            "/rest/v1/notifications" +
            "?select=*" +
            "&order=created_at.desc"
          );

        if (!response) {
          return;
        }

        if (!response.ok) {
          const error =
            await response.json()
              .catch(() => ({}));

          throw new Error(
            error.message ||
            "Unable to load notifications."
          );
        }

        const notifications =
          await response.json();

        if (
          !Array.isArray(
            notifications
          ) ||
          notifications.length === 0
        ) {
          notificationList.innerHTML =
            `
              <div class="empty-state">
                You have no notifications yet.
              </div>
            `;

          return;
        }

        notificationList.innerHTML =
          notifications
            .map(
              notificationHtml
            )
            .join("");

        document
          .querySelectorAll(
            ".notification"
          )
          .forEach(item => {
            item.addEventListener(
              "click",
              () => {
                markNotificationRead(
                  item.dataset.id,
                  item
                );
              }
            );
          });

      } catch (error) {
        console.error(error);

        notificationList.innerHTML =
          `
            <div class="empty-state">
              Unable to load notifications.
            </div>
          `;

        showMessage(
          error.message ||
          "Unable to load notifications.",
          "error"
        );
      }
    }

    async function markNotificationRead(
      notificationId,
      element
    ) {
      if (!notificationId) {
        return;
      }

      if (
        !element.classList.contains(
          "unread"
        )
      ) {
        return;
      }

      try {
        const response =
          await apiRequest(
            "/rest/v1/rpc/mark_notification_read",
            {
              method: "POST",
              body: JSON.stringify({
                p_notification_id:
                  Number(
                    notificationId
                  )
              })
            }
          );

        if (!response) {
          return;
        }

        if (!response.ok) {
          return;
        }

        element.classList.remove(
          "unread"
        );

      } catch (error) {
        console.error(
          "Mark notification error:",
          error
        );
      }
    }

    markAllBtn.addEventListener(
      "click",
      async function () {
        markAllBtn.disabled = true;
        markAllBtn.textContent =
          "Updating...";

        try {
          const response =
            await apiRequest(
              "/rest/v1/rpc/mark_all_notifications_read",
              {
                method: "POST",
                body: JSON.stringify({})
              }
            );

          if (!response) {
            return;
          }

          if (!response.ok) {
            const error =
              await response.json()
                .catch(() => ({}));

            throw new Error(
              error.message ||
              "Unable to mark notifications as read."
            );
          }

          document
            .querySelectorAll(
              ".notification.unread"
            )
            .forEach(item => {
              item.classList.remove(
                "unread"
              );
            });

          showMessage(
            "All notifications have been marked as read.",
            "success"
          );

        } catch (error) {
          console.error(error);

          showMessage(
            error.message ||
            "Unable to update notifications.",
            "error"
          );
        } finally {
          markAllBtn.disabled =
            false;

          markAllBtn.textContent =
            "Mark All as Read";
        }
      }
    );

    loadNotifications();
  </script>

</body>
</html>
