<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Tasks | Task Hub</title>
  <link rel="stylesheet" href="style.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    header {
      background: #101828;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    .brand {
      font-size: 23px;
      font-weight: 800;
    }

    main {
      width: 90%;
      max-width: 1100px;
      margin: 35px auto;
    }

    h1 { font-size: clamp(26px, 5vw, 36px); }

    .muted { color: #667085; line-height: 1.6; }

    .toolbar {
      display: flex;
      gap: 12px;
      margin: 24px 0;
      flex-wrap: wrap;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font: inherit;
      background: white;
    }

    .toolbar input, .toolbar select {
      flex: 1;
      min-width: 150px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border: 1px solid #e4e7ec;
      border-radius: 14px;
      padding: 21px;
      box-shadow: 0 4px 15px #10182808;
    }

    .category {
      display: inline-block;
      background: #eef4ff;
      color: #2457c5;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 12px;
    }

    .card h3 { margin-bottom: 8px; }

    .reward {
      color: #087443;
      font-size: 22px;
      font-weight: 800;
      margin: 18px 0;
    }

    button, .button {
      display: inline-block;
      border: none;
      border-radius: 8px;
      padding: 12px 15px;
      background: #3157d5;
      color: white;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .full { width: 100%; text-align: center; }

    .proof-form {
      border-top: 1px solid #eaecf0;
      margin-top: 18px;
      padding-top: 16px;
    }

    .proof-form label {
      display: block;
      margin: 12px 0 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .proof-form textarea {
      min-height: 90px;
      resize: vertical;
    }

    .status {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .pending { background: #fff7e6; color: #975a00; }
    .approved { background: #ecfdf3; color: #087443; }
    .rejected { background: #fff1f0; color: #b42318; }

    .notice, .empty {
      background: white;
      padding: 20px;
      border-radius: 12px;
      line-height: 1.6;
      margin: 16px 0;
    }

    .error { color: #b42318; }
    .success { color: #087443; }

    footer {
      text-align: center;
      padding: 25px;
      color: #667085;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <a class="brand" href="dashboard.html">Task Hub</a>
    <a href="dashboard.html">← Dashboard</a>
  </header>

  <main>
    <h1>Available Tasks</h1>
    <p class="muted">
      Complete a task, provide your proof, and wait for an administrator to review it.
      Rewards are credited only after approval.
    </p>

    <div id="notice" class="notice" hidden></div>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search tasks...">
      <select id="category">
        <option value="">All categories</option>
      </select>
    </div>

    <p id="count" class="muted">Loading tasks...</p>
    <section id="taskGrid" class="grid"></section>
  </main>

  <footer>Task Hub · Honest work, verified rewards.</footer>

  <script src="script.js"></script>

  <script>
    const grid = document.getElementById("taskGrid");
    const notice = document.getElementById("notice");
    const count = document.getElementById("count");
    const search = document.getElementById("search");
    const category = document.getElementById("category");

    let tasks = [];
    let submissions = [];

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[c]);
    }

    function money(value) {
      return "₦" + Number(value || 0).toLocaleString("en-NG", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function showNotice(message, type = "") {
      notice.hidden = false;
      notice.className = "notice " + type;
      notice.textContent = message;
    }

    function session() {
      return {
        token: localStorage.getItem("taskhub_access_token"),
        userId: localStorage.getItem("taskhub_user_id")
      };
    }

    async function api(path, options = {}) {
      const { token } = session();

      const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        ...options,
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      const text = await response.text();
      let data = null;

      if (text) {
        try { data = JSON.parse(text); }
        catch { data = text; }
      }

      if (!response.ok) {
        throw new Error(
          data?.message || data?.hint || "Request failed. Please try again."
        );
      }

      return data;
    }

    async function loadData() {
      const { token, userId } = session();

      if (!token || !userId) {
        location.href = "login.html";
        return;
      }

      try {
        const [taskData, submissionData] = await Promise.all([
          api("tasks?select=id,title,description,category,reward,instructions,task_link&status=eq.active&order=created_at.desc"),
          api(`task_submissions?select=id,task_id,status,proof,created_at&user_id=eq.${encodeURIComponent(userId)}`)
        ]);

        tasks = taskData || [];
        submissions = submissionData || [];

        fillCategories();
        renderTasks();
      } catch (error) {
        count.textContent = "Unable to load tasks";
        grid.innerHTML = "";
        showNotice(error.message, "error");
      }
    }

    function fillCategories() {
      const values = [...new Set(tasks.map(t => t.category).filter(Boolean))].sort();

      category.innerHTML =
        '<option value="">All categories</option>' +
        values.map(v =>
          `<option value="${escapeHTML(v)}">${escapeHTML(v)}</option>`
        ).join("");
    }

    function renderTasks() {
      const term = search.value.trim().toLowerCase();
      const selectedCategory = category.value;

      const filtered = tasks.filter(task => {
        const text = `${task.title} ${task.description} ${task.category}`.toLowerCase();

        return text.includes(term) &&
          (!selectedCategory || task.category === selectedCategory);
      });

      count.textContent = `${filtered.length} task(s) found`;

      if (!filtered.length) {
        grid.innerHTML = `
          <div class="empty">
            ${tasks.length
              ? "No tasks match your search."
              : "There are no active tasks available right now."}
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map(task => {
        const existing = submissions.find(
          s => Number(s.task_id) === Number(task.id)
        );

        const validLink = /^https?:\/\//i.test(task.task_link || "");

        let submissionSection = "";

        if (existing) {
          submissionSection = `
            <div class="proof-form">
              <p>Your submission status:</p>
              <span class="status ${escapeHTML(existing.status)}">
                ${escapeHTML(existing.status)}
              </span>
              ${existing.status === "pending"
                ? "<p class='muted'>Your proof is awaiting review.</p>"
                : existing.status === "approved"
                  ? "<p class='success'>Your submission was approved.</p>"
                  : "<p class='error'>Your submission was rejected. Contact support if you need help.</p>"}
            </div>`;
        } else {
          submissionSection = `
            <form class="proof-form" data-task-id="${Number(task.id)}">
              <label for="proof-${Number(task.id)}">Proof of completion</label>
              <textarea
                id="proof-${Number(task.id)}"
                name="proof"
                maxlength="2000"
                required
                placeholder="Describe what you completed or paste your proof link."
              ></textarea>
              <p class="muted">
                Submit a genuine proof. Never include passwords or sensitive personal information.
              </p>
              <button class="full" type="submit">Submit Proof</button>
            </form>`;
        }

        return `
          <article class="card">
            <span class="category">${escapeHTML(task.category || "Other")}</span>
            <h3>${escapeHTML(task.title)}</h3>
            <p class="muted">${escapeHTML(task.description || "")}</p>
            <div class="reward">${money(task.reward)}</div>
            ${validLink
              ? `<a class="button full" href="${escapeHTML(task.task_link)}" target="_blank" rel="noopener noreferrer">Open Task</a>`
              : ""}
            ${task.instructions
              ? `<p class="muted"><strong>Instructions:</strong> ${escapeHTML(task.instructions)}</p>`
              : ""}
            ${submissionSection}
          </article>`;
      }).join("");

      grid.querySelectorAll("form[data-task-id]").forEach(form => {
        form.addEventListener("submit", submitProof);
      });
    }

    async function submitProof(event) {
      event.preventDefault();

      const form = event.currentTarget;
      const taskId = Number(form.dataset.taskId);
      const proof = new FormData(form).get("proof").trim();
      const button = form.querySelector("button");

      if (!proof) {
        showNotice("Please enter your proof before submitting.", "error");
        return;
      }

      if (proof.length > 2000) {
        showNotice("Your proof is too long.", "error");
        return;
      }

      const { userId } = session();

      if (!userId) {
        location.href = "login.html";
        return;
      }

      button.disabled = true;
      button.textContent = "Submitting...";

      try {
        await api("task_submissions", {
          method: "POST",
          headers: { "Prefer": "return=minimal" },
          body: JSON.stringify({
            user_id: userId,
            task_id: taskId,
            proof: proof,
            status: "pending"
          })
        });

        showNotice("Proof submitted successfully. It is now awaiting review.", "success");
        await loadData();
      } catch (error) {
        showNotice(
          error.message.includes("duplicate") ||
          error.message.includes("unique")
            ? "You have already submitted this task."
            : error.message,
          "error"
        );

        button.disabled = false;
        button.textContent = "Submit Proof";
      }
    }

    search.addEventListener("input", renderTasks);
    category.addEventListener("change", renderTasks);

    loadData();
  </script>
</body>
</html>
