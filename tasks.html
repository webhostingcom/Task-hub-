<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Hub | Tasks</title>
  <link rel="stylesheet" href="style.css">  <style>
    .page-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 18px 60px;
    }

    .plan-card {
      background: #11111a;
      color: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .plan-card h2 { margin: 0 0 8px; }
    .plan-card p { margin: 5px 0; color: #d6d6df; }

    .plan-btn {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 16px;
      background: #5b5cf0;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
    }

    .task-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .task-card {
      background: white;
      border: 1px solid #e7e7ee;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
      min-width: 0;
    }

    .task-card h3 { margin-top: 0; }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 12px 0;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #f0f0f5;
      font-size: 12px;
      font-weight: 700;
    }

    .reward {
      color: #14804a;
      font-weight: 800;
    }

    .task-link {
      display: inline-block;
      margin-top: 10px;
      color: #5b5cf0;
      font-weight: 700;
      text-decoration: none;
    }

    .proof-box {
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #eeeeF2;
    }

    .proof-upload {
      margin-top: 12px;
      padding: 15px;
      border: 1px dashed #b8b8d5;
      border-radius: 10px;
      background: #f8f8ff;
    }

    .proof-upload label {
      display: block;
      font-weight: 700;
      font-size: 14px;
    }

    .proof-upload input {
      display: block;
      width: 100%;
      margin-top: 10px;
      box-sizing: border-box;
    }

    .proof-preview {
      display: none;
      max-width: 100%;
      max-height: 260px;
      margin-top: 12px;
      border-radius: 10px;
      object-fit: contain;
    }

    .submit-proof-btn {
      margin-top: 9px;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #5b5cf0;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-proof-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .submission-status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: #f4f4f8;
      font-size: 14px;
      font-weight: 700;
    }

    .status-pending { color: #996500; }
    .status-approved { color: #16804a; }
    .status-rejected { color: #c62828; }

    .instructions {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #555;
      line-height: 1.6;
      margin-top: 12px;
    }

    .notice {
      padding: 13px 15px;
      border-radius: 9px;
      margin-bottom: 20px;
      display: none;
      overflow-wrap: anywhere;
    }

    .notice.error {
      display: block;
      background: #ffe9e9;
      color: #b42318;
    }

    .notice.success {
      display: block;
      background: #e9f8ef;
      color: #147a3e;
    }

    .empty {
      padding: 30px 10px;
      text-align: center;
      color: #666;
    }

    .upgrade-message {
      background: #fff7df;
      color: #795900;
      padding: 10px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 13px;
    }
  </style></head><body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="dashboard.html" class="logo">Task Hub</a>  <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
    ☰
  </button>

  <nav id="mainNav">
    <a href="dashboard.html">Dashboard</a>
    <a href="tasks.html">Tasks</a>
    <a href="wallet.html">Wallet</a>
    <a href="plans.html">Plans</a>
    <a href="profile.html">Profile</a>
    <a href="#" id="logoutBtn">Logout</a>
  </nav>
</div>

  </header>  <main class="page-wrap">
    <div id="notice" class="notice" role="status" aria-live="polite"></div><section class="plan-card">
  <h2>Your Current Plan</h2>
  <p id="planName">Loading...</p>
  <p id="planReward"></p>
  <a href="plans.html" class="plan-btn">View Plans / Upgrade</a>
</section>

<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;">
  <div>
    <h1 style="margin-bottom:5px;">Available Tasks</h1>
    <p id="taskCount" style="color:#666;">Loading tasks...</p>
  </div>
</div>

<div id="taskGrid" class="task-grid"></div>

  </main><script>
"use strict";

const SUPABASE_URL = "https://bcogfxghqrffrnfetqbo.supabase.co";
const SUPABASE_KEY = "sb_publishable_cX6B4WgoF6bwz1Br5kIj4g_p4RsBRJP";
const PROOF_BUCKET = "task-proofs";
const MAX_PROOF_SIZE = 5 * 1024 * 1024;

const ALLOWED_IMAGE_TYPES = {
  "image/jpeg": "jpg",
  "image/png": "png",
  "image/webp": "webp"
};

const taskGrid = document.getElementById("taskGrid");
const taskCount = document.getElementById("taskCount");
const planName = document.getElementById("planName");
const planReward = document.getElementById("planReward");
const notice = document.getElementById("notice");

let accessToken = localStorage.getItem("taskhub_access_token");
let userId = localStorage.getItem("taskhub_user_id");

let currentPlan = {
  name: "Free",
  reward: 100
};

let noticeTimer;
const previewUrls = new Set();

function showNotice(message, type = "error") {
  clearTimeout(noticeTimer);
  notice.textContent = message;
  notice.className = "notice " + type;

  noticeTimer = setTimeout(() => {
    notice.className = "notice";
    notice.textContent = "";
  }, 7000);
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function clearSessionAndLogin() {
  localStorage.removeItem("taskhub_access_token");
  localStorage.removeItem("taskhub_refresh_token");
  localStorage.removeItem("taskhub_user_id");
  localStorage.removeItem("taskhub_email");
  window.location.href = "login.html";
}

async function supabaseRequest(path, options = {}) {
  const headers = {
    "apikey": SUPABASE_KEY,
    ...(accessToken ? { "Authorization": "Bearer " + accessToken } : {}),
    ...(options.headers || {})
  };

  // Let the browser set multipart/binary headers when uploading a File.
  if (
    !options.body ||
    !(options.body instanceof Blob)
  ) {
    if (!headers["Content-Type"]) {
      headers["Content-Type"] = "application/json";
    }
  }

  return fetch(SUPABASE_URL + path, {
    ...options,
    headers
  });
}

async function readResponse(response) {
  const text = await response.text();

  if (!text) return null;

  try {
    return JSON.parse(text);
  } catch {
    return text;
  }
}

function setFreePlan() {
  currentPlan = { name: "Free", reward: 100 };
  planName.textContent = "Free Plan";
  planReward.textContent = "Task reward: ₦100 per approved task";
}

async function loadCurrentPlan() {
  try {
    const response = await supabaseRequest(
      `/rest/v1/taskhub_subscriptions?select=id,plan_id,status,expires_at&user_id=eq.${encodeURIComponent(userId)}&status=eq.active&order=created_at.desc&limit=10`
    );

    if (response.status === 401) {
      clearSessionAndLogin();
      return false;
    }

    if (!response.ok) {
      throw new Error(await response.text());
    }

    const subscriptions = await response.json();
    const now = Date.now();

    const validSubscription = Array.isArray(subscriptions)
      ? subscriptions.find(subscription =>
          !subscription.expires_at ||
          new Date(subscription.expires_at).getTime() > now
        )
      : null;

    if (!validSubscription) {
      setFreePlan();
      return true;
    }

    const planResponse = await supabaseRequest(
      `/rest/v1/taskhub_plans?id=eq.${encodeURIComponent(validSubscription.plan_id)}&select=id,name,reward&limit=1`
    );

    if (planResponse.status === 401) {
      clearSessionAndLogin();
      return false;
    }

    if (!planResponse.ok) {
      throw new Error(await planResponse.text());
    }

    const plans = await planResponse.json();

    if (!Array.isArray(plans) || !plans.length) {
      throw new Error("Your subscription plan could not be found.");
    }

    currentPlan = {
      name: String(plans[0].name || "Free"),
      reward: Number(plans[0].reward || 0)
    };

    planName.textContent = currentPlan.name + " Plan";
    planReward.textContent =
      "Task reward: ₦" +
      currentPlan.reward.toLocaleString("en-NG") +
      " per approved task";

    return true;

  } catch (error) {
    console.error("Plan loading error:", error);
    showNotice("Unable to confirm your plan. Please refresh and try again.");
    planName.textContent = "Plan unavailable";
    planReward.textContent = "Tasks are temporarily unavailable.";
    return false;
  }
}

function canAccessTask(task) {
  const access = String(task.access_level || "free").toLowerCase();
  const plan = String(currentPlan.name || "Free").toLowerCase();

  if (access === "all") return true;
  if (access === "free") return plan === "free";
  if (access === "pro") return plan === "pro" || plan === "premium";
  if (access === "premium") return plan === "premium";

  return false;
}

function accessLabel(access) {
  const value = String(access || "free").toLowerCase();

  if (value === "pro") return "Pro + Premium";
  if (value === "premium") return "Premium Only";
  if (value === "all") return "Everyone";

  return "Free Only";
}

function requiredPlanText(access) {
  const value = String(access || "").toLowerCase();

  if (value === "pro") return "Pro or Premium";
  if (value === "premium") return "Premium";

  return "Free";
}

async function loadSubmissions() {
  const response = await supabaseRequest(
    `/rest/v1/task_submissions?select=id,task_id,status,proof,created_at,reviewed_at&user_id=eq.${encodeURIComponent(userId)}&order=created_at.desc`
  );

  if (response.status === 401) {
    clearSessionAndLogin();
    return [];
  }

  if (!response.ok) {
    throw new Error("Unable to load your submissions: " + await response.text());
  }

  return await response.json();
}

function getSubmissionForTask(submissions, taskId) {
  return submissions.find(
    submission => String(submission.task_id) === String(taskId)
  );
}

function submissionStatusHtml(submission) {
  if (!submission) return "";

  const status = String(submission.status || "pending").toLowerCase();

  if (status === "approved") {
    return `
      <div class="submission-status status-approved">
        ✓ Approved. Your submission has been reviewed.
      </div>
    `;
  }

  if (status === "rejected") {
    return `
      <div class="submission-status status-rejected">
        ✕ Rejected. Please review the instructions and submit new proof.
      </div>
    `;
  }

  return `
    <div class="submission-status status-pending">
      ⏳ Screenshot submitted — waiting for admin review.
    </div>
  `;
}

function proofUploadHtml(taskId, buttonText = "Upload & Submit Screenshot") {
  const safeId = escapeHtml(taskId);

  return `
    <div class="proof-box">
      <strong>Submit Screenshot Proof</strong>

      <p style="font-size:13px;color:#666;">
        Complete the task, take a screenshot showing your result,
        then select the screenshot below. JPG, PNG, and WebP images
        up to 5 MB are accepted.
      </p>

      <div class="proof-upload">
        <label for="proof-${safeId}">Choose screenshot</label>

        <input
          id="proof-${safeId}"
          type="file"
          class="proof-image"
          data-task-id="${safeId}"
          accept="image/jpeg,image/png,image/webp"
          required
        >

        <img
          class="proof-preview"
          data-preview-task="${safeId}"
          alt="Selected screenshot preview"
        >
      </div>

      <button
        type="button"
        class="submit-proof-btn"
        data-submit-task="${safeId}"
      >
        ${escapeHtml(buttonText)}
      </button>
    </div>
  `;
}

function renderTask(task, submission) {
  const accessible = canAccessTask(task);
  const access = String(task.access_level || "free").toLowerCase();
  const reward = Number(task.reward || 0).toLocaleString("en-NG");

  let actionHtml = "";

  if (!accessible) {
    actionHtml = `
      <div class="upgrade-message">
        This task is available to ${escapeHtml(requiredPlanText(access))} members.
        <br>
        <a href="plans.html" class="task-link">View plans</a>
      </div>
    `;
  } else if (submission) {
    const status = String(submission.status || "pending").toLowerCase();

    actionHtml = submissionStatusHtml(submission);

    if (status === "rejected") {
      actionHtml += proofUploadHtml(task.id, "Resubmit Screenshot");
    }
  } else {
    actionHtml = proofUploadHtml(task.id);
  }

  return `
    <article class="task-card">
      <h3>${escapeHtml(task.title)}</h3>

      <div class="task-meta">
        <span class="badge">${escapeHtml(task.category || "General")}</span>
        <span class="badge">${escapeHtml(accessLabel(access))}</span>
        <span class="badge reward">₦${reward}</span>
      </div>

      ${task.description ? `<p>${escapeHtml(task.description)}</p>` : ""}

      ${
        task.instructions
          ? `<div class="instructions"><strong>Instructions:</strong><br>${escapeHtml(task.instructions)}</div>`
          : ""
      }

      ${
        task.task_link
          ? `<a href="${escapeHtml(task.task_link)}" target="_blank" rel="noopener noreferrer" class="task-link">Open Task →</a>`
          : ""
      }

      ${actionHtml}
    </article>
  `;
}

function validateImage(file) {
  if (!file) {
    throw new Error("Please choose a screenshot first.");
  }

  if (!Object.prototype.hasOwnProperty.call(ALLOWED_IMAGE_TYPES, file.type)) {
    throw new Error("Choose a JPG, PNG, or WebP image.");
  }

  if (file.size > MAX_PROOF_SIZE) {
    throw new Error("Your screenshot must be 5 MB or smaller.");
  }
}

async function uploadProofImage(file, taskId) {
  const extension = ALLOWED_IMAGE_TYPES[file.type];
  const randomName = crypto.randomUUID();
  const filePath = `${userId}/${taskId}/${randomName}.${extension}`;

  const response = await supabaseRequest(
    `/storage/v1/object/${PROOF_BUCKET}/${filePath}`,
    {
      method: "POST",
      headers: {
        "Content-Type": file.type,
        "x-upsert": "false"
      },
      body: file
    }
  );

  if (!response.ok) {
    const result = await readResponse(response);
    throw new Error(
      typeof result === "string"
        ? result
        : result?.message || "Screenshot upload failed. Check the Storage bucket and upload permissions."
    );
  }

  return filePath;
}

async function submitProof(taskId, button) {
  const input = taskGrid.querySelector(
    `.proof-image[data-task-id="${CSS.escape(String(taskId))}"]`
  );

  const file = input?.files?.[0];

  try {
    validateImage(file);
  } catch (error) {
    showNotice(error.message);
    return;
  }

  button.disabled = true;
  button.textContent = "Uploading screenshot...";

  let uploadedPath = null;

  try {
    // Find an existing rejected submission so it can be updated.
    const submissionsResponse = await supabaseRequest(
      `/rest/v1/task_submissions?select=id,status&user_id=eq.${encodeURIComponent(userId)}&task_id=eq.${encodeURIComponent(taskId)}&limit=1`
    );

    if (submissionsResponse.status === 401) {
      clearSessionAndLogin();
      return;
    }

    if (!submissionsResponse.ok) {
      throw new Error(
        "Unable to check your previous submission: " +
        await submissionsResponse.text()
      );
    }

    const existingRows = await submissionsResponse.json();
    const existing = Array.isArray(existingRows) ? existingRows[0] : null;

    if (existing && String(existing.status).toLowerCase() !== "rejected") {
      throw new Error(
        "This task already has a submission awaiting review or has been approved."
      );
    }

    uploadedPath = await uploadProofImage(file, taskId);

    button.textContent = "Saving submission...";

    let response;

    if (existing) {
      // Resubmit the existing rejected row rather than violating a
      // unique user/task constraint by inserting a duplicate.
      response = await supabaseRequest(
        `/rest/v1/task_submissions?id=eq.${encodeURIComponent(existing.id)}&user_id=eq.${encodeURIComponent(userId)}&status=eq.rejected`,
        {
          method: "PATCH",
          headers: {
            "Prefer": "return=representation",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            proof: uploadedPath,
            status: "pending"
          })
        }
      );
    } else {
      response = await supabaseRequest(
        "/rest/v1/task_submissions",
        {
          method: "POST",
          headers: {
            "Prefer": "return=representation",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            user_id: userId,
            task_id: Number(taskId),
            proof: uploadedPath,
            status: "pending"
          })
        }
      );
    }

    if (response.status === 401) {
      clearSessionAndLogin();
      return;
    }

    if (!response.ok) {
      const result = await readResponse(response);
      throw new Error(
        typeof result === "string"
          ? result
          : result?.message || "The screenshot uploaded, but the submission could not be saved."
      );
    }

    const savedRows = await readResponse(response);

    if (!Array.isArray(savedRows) || savedRows.length === 0) {
      throw new Error(
        "Supabase did not confirm that the submission was saved. Check the task_submissions permissions."
      );
    }

    uploadedPath = null; // The saved submission now references this image.

    showNotice(
      "Screenshot submitted successfully. It is now awaiting admin review.",
      "success"
    );

    await loadTasks();

  } catch (error) {
    console.error("Screenshot submission error:", error);

    showNotice(error.message || "Unable to submit screenshot proof.");

    button.disabled = false;
    button.textContent = "Upload & Submit Screenshot";

  } finally {
    // If submission saving failed after upload, the uploaded object may
    // remain in Storage. It is deliberately not deleted automatically.
  }
}

async function loadTasks() {
  taskGrid.innerHTML = `<div class="empty">Loading tasks...</div>`;

  try {
    const response = await supabaseRequest(
      "/rest/v1/tasks?select=id,title,description,category,reward,instructions,task_link,status,access_level,created_at&status=eq.active&order=created_at.desc"
    );

    if (response.status === 401) {
      showNotice("Your session has expired. Redirecting to login...");
      setTimeout(clearSessionAndLogin, 1200);
      return;
    }

    if (!response.ok) {
      throw new Error(await response.text());
    }

    const tasks = await response.json();
    const submissions = await loadSubmissions();

    const accessibleTasks = tasks.filter(canAccessTask);

    taskCount.textContent =
      accessibleTasks.length +
      (accessibleTasks.length === 1 ? " task available" : " tasks available");

    if (accessibleTasks.length === 0) {
      taskGrid.innerHTML = `
        <div class="empty">
          No tasks are currently available for your plan.
          <br><br>
          <a href="plans.html" class="task-link">View plans</a>
        </div>
      `;
      return;
    }

    // Revoke old preview object URLs before replacing the task cards.
    previewUrls.forEach(url => URL.revokeObjectURL(url));
    previewUrls.clear();

    taskGrid.innerHTML = accessibleTasks
      .map(task => renderTask(
        task,
        getSubmissionForTask(submissions, task.id)
      ))
      .join("");

  } catch (error) {
    console.error("Task loading error:", error);

    taskGrid.innerHTML = `<div class="empty">Unable to load tasks. ${escapeHtml(error.message)}</div>`;
    taskCount.textContent = "Unable to load tasks";
  }
}

taskGrid.addEventListener("change", event => {
  const input = event.target;

  if (!input.matches(".proof-image")) return;

  const file = input.files?.[0];
  const taskId = input.dataset.taskId;

  const preview = taskGrid.querySelector(
    `[data-preview-task="${CSS.escape(String(taskId))}"]`
  );

  if (!preview) return;

  if (!file) {
    preview.style.display = "none";
    preview.removeAttribute("src");
    return;
  }

  try {
    validateImage(file);
  } catch (error) {
    input.value = "";
    preview.style.display = "none";
    preview.removeAttribute("src");
    showNotice(error.message);
    return;
  }

  if (preview.dataset.objectUrl) {
    URL.revokeObjectURL(preview.dataset.objectUrl);
    previewUrls.delete(preview.dataset.objectUrl);
  }

  const url = URL.createObjectURL(file);
  preview.dataset.objectUrl = url;
  previewUrls.add(url);
  preview.src = url;
  preview.style.display = "block";
});

taskGrid.addEventListener("click", event => {
  const button = event.target.closest("[data-submit-task]");

  if (!button) return;

  submitProof(button.dataset.submitTask, button);
});

document.getElementById("logoutBtn").addEventListener("click", event => {
  event.preventDefault();
  clearSessionAndLogin();
});

const menuToggle = document.getElementById("menuToggle");
const mainNav = document.getElementById("mainNav");

if (menuToggle && mainNav) {
  menuToggle.addEventListener("click", () => {
    mainNav.classList.toggle("open");
  });
}

async function init() {
  if (!accessToken || !userId) {
    window.location.href = "login.html";
    return;
  }

  const planLoaded = await loadCurrentPlan();

  if (!planLoaded) {
    taskGrid.innerHTML = `<div class="empty">Unable to verify your plan. Refresh the page to try again.</div>`;
    taskCount.textContent = "Plan verification required";
    return;
  }

  await loadTasks();
}

init();
</script></body>
</html>
