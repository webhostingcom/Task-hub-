<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Task Hub | Leaderboard</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #222;
      min-height: 100vh;
    }

    .header {
      background: #111;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 20px;
    }

    .back-link {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      width: 92%;
      max-width: 800px;
      margin: 30px auto;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }

    .card h2 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .leaderboard {
      display: flex;
      flex-direction: column;
    }

    .leader {
      display: grid;
      grid-template-columns: 55px 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 15px 5px;
      border-bottom: 1px solid #eee;
    }

    .leader:last-child {
      border-bottom: none;
    }

    .rank {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #f0f0ff;
      color: #5b5cf0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .rank.top {
      background: #5b5cf0;
      color: white;
    }

    .username {
      font-weight: 700;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .tasks {
      color: #888;
      font-size: 12px;
    }

    .earnings {
      font-weight: 800;
      color: #16823b;
      text-align: right;
      white-space: nowrap;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 25px 10px;
      color: #888;
      font-size: 14px;
    }

    .error {
      color: #b3261e;
    }

    @media (max-width: 520px) {
      .leader {
        grid-template-columns: 45px 1fr;
      }

      .earnings {
        grid-column: 2;
        text-align: left;
      }
    }
  </style></head><body>  <header class="header">
    <h1>Task Hub</h1><a
  href="dashboard.html"
  class="back-link"
>
  ← Dashboard
</a>

  </header>  <main class="container"><section class="card">

  <h2>Leaderboard</h2>

  <p class="subtitle">
    See the top Task Hub members ranked by approved
    task activity and earnings.
  </p>


  <div
    id="leaderboard"
    class="leaderboard"
  >
    <div class="loading">
      Loading leaderboard...
    </div>
  </div>

</section>

  </main>  <script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://bcogfxghqrffrnfetqbo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_cX6B4WgoF6bwz1Br5kIj4g_p4RsBRJP";


    const accessToken =
      localStorage.getItem(
        "taskhub_access_token"
      );

    const userId =
      localStorage.getItem(
        "taskhub_user_id"
      );


    // ==========================================
    // AUTH
    // ==========================================

    if (!accessToken || !userId) {
      window.location.href = "login.html";
    }


    // ==========================================
    // ELEMENT
    // ==========================================

    const leaderboardElement =
      document.getElementById(
        "leaderboard"
      );


    // ==========================================
    // HEADERS
    // ==========================================

    function getHeaders() {

      return {
        apikey: SUPABASE_KEY,
        Authorization:
          `Bearer ${accessToken}`,
        "Content-Type":
          "application/json"
      };

    }


    // ==========================================
    // SESSION EXPIRATION
    // ==========================================

    function handleExpiredSession() {

      localStorage.removeItem(
        "taskhub_access_token"
      );

      localStorage.removeItem(
        "taskhub_refresh_token"
      );

      localStorage.removeItem(
        "taskhub_user_id"
      );

      localStorage.removeItem(
        "taskhub_email"
      );

      window.location.href =
        "login.html";

    }


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHtml(value) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    // ==========================================
    // FORMAT MONEY
    // ==========================================

    function formatMoney(amount) {

      return Number(
        amount || 0
      ).toLocaleString(
        "en-NG",
        {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        }
      );

    }


    // ==========================================
    // LOAD LEADERBOARD
    // ==========================================

    async function loadLeaderboard() {

      try {

        const response =
          await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/get_taskhub_leaderboard`,
            {
              method: "POST",
              headers:
                getHeaders(),
              body:
                JSON.stringify({})
            }
          );


        if (
          response.status === 401 ||
          response.status === 403
        ) {

          handleExpiredSession();

          return;

        }


        const text =
          await response.text();


        let data = null;


        try {

          data =
            text
              ? JSON.parse(text)
              : null;

        } catch {

          data =
            text;

        }


        if (!response.ok) {

          throw new Error(
            data?.message ||
            data?.hint ||
            "Unable to load leaderboard."
          );

        }


        const rows =
          Array.isArray(data)
            ? data
            : [];


        if (rows.length === 0) {

          leaderboardElement.innerHTML =
            `<div class="empty">
              No leaderboard data available yet.
            </div>`;

          return;

        }


        leaderboardElement.innerHTML =
          "";


        rows.forEach(
          (row, index) => {

            const position =
              index + 1;


            /*
              The RPC may expose the values using
              slightly different aliases depending on
              the database return definition, so the
              frontend accepts the expected variants.
            */

            const username =
              row.username ||
              row.full_name ||
              row.name ||
              "Task Hub User";


            const approvedTasks =
              Number(
                row.approved_tasks ??
                row.task_count ??
                row.completed_tasks ??
                row.tasks_completed ??
                0
              );


            const earnings =
              Number(
                row.total_earnings ??
                row.earnings ??
                row.total_reward ??
                row.balance_earned ??
                0
              );


            const item =
              document.createElement(
                "div"
              );

            item.className =
              "leader";


            item.innerHTML = `
              <div class="rank ${
                position <= 3
                  ? "top"
                  : ""
              }">
                ${position}
              </div>

              <div>
                <div class="username">
                  ${escapeHtml(username)}
                </div>

                <div class="tasks">
                  ${approvedTasks}
                  approved task${
                    approvedTasks === 1
                      ? ""
                      : "s"
                  }
                </div>
              </div>

              <div class="earnings">
                ₦${formatMoney(earnings)}
              </div>
            `;


            leaderboardElement.appendChild(
              item
            );

          }
        );


      } catch (error) {

        console.error(
          "Leaderboard error:",
          error
        );


        leaderboardElement.innerHTML =
          `<div class="error">
            Unable to load leaderboard right now.
          </div>`;

      }

    }


    // ==========================================
    // INITIAL LOAD
    // ==========================================

    loadLeaderboard();

  </script>
  
  </body>
</html>
